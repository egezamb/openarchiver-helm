# Default values for open-archiver.

# -- Override the chart name used in resource names
nameOverride: ""
# -- Override the full resource name prefix
fullnameOverride: ""

image:
  repository: logiclabshq/open-archiver
  # -- Image tag. Defaults to the chart's appVersion.
  tag: ""
  # -- Image digest (sha256:...). When set, it is used instead of the tag, so a re-pushed tag cannot
  # change what runs.
  digest: ""
  pullPolicy: IfNotPresent

# -- Secrets for pulling images from a private registry
imagePullSecrets: []

# -- Public URL of Open Archiver, without a trailing slash. Used for CORS, as the SvelteKit ORIGIN
# and to build the OAuth redirect URI ({appUrl}/api/v1/oauth/callback).
appUrl: http://localhost:3000

# -- Extra settings for the app, as environment variables. Names and meanings are the ones in
# upstream's .env.example (https://github.com/LogicLabs-OU/OpenArchiver/blob/main/.env.example);
# anything left out uses the app's own default. Secrets do not belong here, see `secrets`.
# Set by the chart and not overridable here: PORT_BACKEND, PORT_FRONTEND, NODE_ENV, APP_URL, ORIGIN,
# STORAGE_*, DATABASE_URL, REDIS_*, MEILI_HOST, MEILI_MASTER_KEY, TIKA_URL and the secrets.
# Names that look like secrets (…PASSWORD, …SECRET, …TOKEN, …_KEY) are refused: env ends up in a
# ConfigMap. Pass those through extraEnv with a secretKeyRef.
env:
  # Required by the app
  JWT_EXPIRES_IN: 7d
  # Largest upload the web UI accepts (PST, mbox and EML imports). The app's own default is 512K.
  BODY_SIZE_LIMIT: 100M
  # SYNC_FREQUENCY: "* * * * *"
  # ALL_INCLUSIVE_ARCHIVE: "false"
  # ENABLE_DELETION: "false"
  # INGESTION_WORKER_CONCURRENCY: "5"

# -- Heap ceiling of the indexing worker in MB (INDEXING_WORKER_MAX_OLD_SPACE_MB). It shares the
# container with the frontend, API, ingestion worker and scheduler, so keep it well below
# resources.limits.memory. When the container runs out of memory, most current clusters (cgroup v2)
# restart the whole container; on older ones the kernel kills only the biggest process, and a
# killed API is not restarted inside the container until the liveness probe notices.
indexingWorkerMaxOldSpaceMb: 1536

# -- Extra environment variables for the app container, as a list of EnvVar objects
extraEnv: []
# -- Extra environment variables loaded from ConfigMaps or Secrets (envFrom)
extraEnvFrom: []

# Application secrets. Leave a value empty to have the chart generate it on the first
# `helm install` and keep it on upgrades. Generated Secrets are kept on `helm uninstall`
# (helm.sh/resource-policy: keep), because the data stores and the archive depend on them.
# GitOps tools such as Argo CD render the chart without cluster access, so they would generate new
# values on every sync: with them, set every `existingSecret` instead. Back these Secrets up together
# with the database and the archive.
secrets:
  # -- Name of an existing Secret with the keys below. When set, the chart creates no app Secret.
  existingSecret: ""
  # -- Signs login tokens (key: jwt-secret)
  jwtSecret: ""
  # -- Encrypts stored mailbox credentials (key: encryption-key). Any string works; the chart
  # generates 64 hex characters. Losing it makes the saved credentials unreadable.
  encryptionKey: ""
  # -- Optional, 64 hex characters; encrypts archived files at rest (key: storage-encryption-key).
  # Not generated. Once set, the chart keeps it on upgrades and refuses a different one, because
  # files written with a key cannot be read without it. Store a copy apart from the archive backup.
  # Search indexes and the database are not covered by it.
  storageEncryptionKey: ""
  # -- Stop the pod when the storage key is missing instead of archiving unencrypted. Turn on once
  # the archive is encrypted, especially with existingSecret.
  requireStorageEncryptionKey: false

storage:
  # -- Where archived emails are stored: local or s3
  type: local
  # -- Path inside the container for local storage
  localRootPath: /var/data/open-archiver
  # Volume for local storage, created only when type is local
  persistence:
    enabled: true
    # -- Use an existing PersistentVolumeClaim instead of creating one. A claim the chart creates
    # is kept on `helm uninstall` (helm.sh/resource-policy: keep).
    existingClaim: ""
    # -- StorageClass. Empty uses the cluster default.
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
  s3:
    endpoint: ""
    bucket: ""
    region: ""
    # -- Set to true for MinIO and other non-AWS S3 services
    forcePathStyle: false
    # -- Existing Secret with the keys s3-access-key-id and s3-secret-access-key
    existingSecret: ""
    accessKeyId: ""
    secretAccessKey: ""

service:
  # -- Prefer ClusterIP and expose the app through an Ingress.
  type: ClusterIP
  # -- Port of the web UI (the SvelteKit frontend, which proxies the API)
  port: 3000

ingress:
  enabled: false
  className: ""
  # -- e.g. nginx.ingress.kubernetes.io/proxy-body-size: 100m, so uploads up to BODY_SIZE_LIMIT pass
  annotations: {}
  # -- Allow appUrl with http:// or an Ingress without tls. The login token is a cookie without the
  # Secure flag, so use this for tests only.
  allowInsecureHttp: false
  # -- The host of appUrl must be one of these
  hosts:
    - host: archive.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: archive-example-com-tls
  #    hosts:
  #      - archive.example.com

# -- Resources for the app container. The indexing worker alone may use up to
# indexingWorkerMaxOldSpaceMb of heap.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 3Gi

# Probes go through the frontend on the http port; it forwards /api/* to the backend.
# -- Gives the first start time to download dependencies and run migrations (up to 10 minutes)
startupProbe:
  httpGet:
    path: /api/v1/auth/status
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60
# -- Takes the pod out of the Service while the API or the database does not answer
readinessProbe:
  httpGet:
    path: /api/v1/auth/status
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
# -- Restarts the pod when the frontend (3000) or the API (4000) process is gone. A plain TCP check
# on both ports.
# Does not touch the database, so a database outage does not restart the pod.
livenessProbe:
  exec:
    command: ["sh", "-c", "nc -z 127.0.0.1 3000 && nc -z 127.0.0.1 4000"]
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

# Scratch space for imports (PST, mbox, zip), mounted at /tmp
tmpVolume:
  # -- Size limit. An import that outgrows it evicts the pod instead of filling the node's disk.
  sizeLimit: 10Gi

# -- Extra volumes for the pod, e.g. a share for the app's "Local Path" import
extraVolumes: []
# -- Extra volume mounts for the app container
extraVolumeMounts: []

# Note: on every start the image's entrypoint downloads its Node dependencies from
# registry.npmjs.org (`pnpm install --prod`) and runs the database migrations. The pod needs egress
# to the npm registry, and the first start can take a few minutes.
podAnnotations: {}
podLabels: {}
# -- Run the pod in a user namespace (hostUsers: false), so root in the container is an
# unprivileged user on the node. Needs Kubernetes 1.33+ and a runtime and filesystem that support
# it. Unset leaves the cluster default.
hostUsers: null
# -- Pod security context. The image runs as root: its entrypoint runs `pnpm install` and
# migrations on start and writes to /app, so runAsNonRoot is not possible without an image change.
podSecurityContext: {}
# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  # -- Allow traffic to the web UI port only, keeping the internal API port (4000) closed to other
  # pods. The bundled services accept connections from the app only and cannot open any outgoing
  # connection. Needs a CNI that enforces NetworkPolicy.
  enabled: true
  # -- Who may reach the web UI, as NetworkPolicy peers (e.g. the Ingress controller's namespace).
  # Empty allows every source.
  ingressFrom: []

serviceAccount:
  # -- Create a ServiceAccount for the app
  create: true
  # -- Name of the ServiceAccount. Defaults to the full name.
  name: ""
  # -- The app does not talk to the Kubernetes API
  automountServiceAccountToken: false

# Bundled PostgreSQL. Disable it to use externalDatabase.
# Volume settings of the bundled services (size, storageClass, enabled) cannot change after install:
# StatefulSet volume templates are immutable. Grow a volume by editing its PVC, if the StorageClass
# allows expansion. A major PostgreSQL upgrade (17 → 18) needs a dump and restore, and switching
# between the alpine and debian images changes text sorting, which can corrupt text indexes.
# Back up with: kubectl exec <fullname>-postgresql-0 -- pg_dump -U postgres -Fc <db>, where <fullname> is
# <release>-open-archiver, or just <release> when the release name already contains open-archiver.
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 17.11-alpine
    digest: ""
    pullPolicy: IfNotPresent
  # The app connects as its own role, which owns the database but is not a superuser, so a SQL
  # injection in the app cannot reach superuser features such as COPY ... TO PROGRAM. The
  # superuser ("postgres") gets a separate password and is only for maintenance.
  auth:
    database: open_archive
    username: open_archiver
    # -- Password of the app role. Generated when empty. Like database and username, it is read only
    # when the database is created: the chart refuses a different value later.
    password: ""
    # -- Password of the "postgres" superuser. Generated when empty.
    postgresPassword: ""
    # -- Existing Secret with both passwords. PostgreSQL takes them only when it creates the
    # database, so changing them later in values or in the Secret does not change them in the
    # database (use ALTER ROLE for that).
    existingSecret: ""
    # Key names follow the common convention (also used by the Bitnami chart): "password" for the
    # app role, "postgres-password" for the superuser.
    existingSecretPasswordKey: password
    existingSecretSuperuserPasswordKey: postgres-password
  persistence:
    enabled: true
    storageClass: ""
    size: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Used when postgresql.enabled is false
externalDatabase:
  host: ""
  port: 5432
  database: open_archive
  username: ""
  password: ""
  # -- Existing Secret holding the password. Any characters are fine: the password is passed as
  # PGPASSWORD, not inside the connection URL.
  existingSecret: ""
  # -- Key holding the app role's password (not a superuser's)
  existingSecretPasswordKey: password
  # -- sslmode for the connection. Use verify-full: require encrypts but does not check the server's
  # certificate, so it does not stop a man in the middle. For a private CA such as the RDS one, mount
  # the CA bundle with extraVolumes/extraVolumeMounts and point NODE_EXTRA_CA_CERTS (extraEnv) at it.
  # Empty leaves it out.
  sslMode: ""

# Bundled Valkey (Redis compatible) for the job queues. Disable it to use externalRedis.
valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: 8.1.10-alpine
    digest: ""
    pullPolicy: IfNotPresent
  auth:
    # -- Generated when empty
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: redis-password
  persistence:
    enabled: true
    storageClass: ""
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi
  # -- Memory Valkey may use for data, well below resources.limits.memory: saving the append-only
  # file forks the process, which can briefly need more. Past it, writes fail with an error.
  maxmemory: 300mb
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Used when valkey.enabled is false
externalRedis:
  host: ""
  port: 6379
  # -- Only for servers with ACL users. Leave empty for a server that uses requirepass alone.
  username: ""
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: redis-password
  # -- Connect with TLS. The app does not verify the server certificate, so this protects against
  # eavesdropping only: keep the connection on a private network path.
  tls: false

# Bundled Meilisearch for full-text search. Disable it to use externalMeilisearch.
meilisearch:
  enabled: true
  image:
    # -- The version upstream tests with. Meilisearch keeps its data in a format tied to the
    # version: before a minor upgrade, check the Meilisearch upgrade guide (dump and import, or a
    # dumpless upgrade).
    repository: getmeili/meilisearch
    tag: v1.38.2
    digest: ""
    pullPolicy: IfNotPresent
  # -- Generated when empty. At least 16 bytes: Meilisearch refuses shorter keys in production mode.
  masterKey: ""
  existingSecret: ""
  existingSecretKey: meili-master-key
  # -- Seconds between snapshots. They are written to the same volume, so size it for about twice
  # the index, and copy them elsewhere if you need a backup. The index can also be rebuilt from the
  # database and the archive (Admin → reindex), slowly for large archives.
  snapshotInterval: 86400
  # -- Extra environment variables, e.g. MEILI_UPGRADE_DB=true for a dumpless upgrade to a newer
  # Meilisearch version (see the Meilisearch upgrade guide; take a snapshot first)
  extraEnv: []
  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Used when meilisearch.enabled is false
externalMeilisearch:
  url: ""
  masterKey: ""
  existingSecret: ""
  existingSecretKey: meili-master-key

# Bundled Apache Tika for text extraction from attachments, including OCR of scanned files. It has
# no authentication and parses untrusted attachments, so it relies on the NetworkPolicy: on a
# cluster whose CNI does not enforce NetworkPolicy, consider turning it off.
# Without Tika the app uses its built-in PDF extractor, has no OCR and limits attachments to 50 MB
# instead of 100 MB. Disable it on small clusters to save about 1 GB of memory.
tika:
  enabled: true
  image:
    repository: apache/tika
    tag: 3.3.1.0-full
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1536Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- URL of an external Tika server, used when tika.enabled is false. Empty disables Tika.
externalTika:
  url: ""
