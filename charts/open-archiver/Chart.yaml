apiVersion: v2
name: open-archiver
description: Self-hosted email archiving with full-text search. Runs Open Archiver with optional bundled PostgreSQL, Valkey, Meilisearch and Apache Tika.
type: application
# Version of the chart itself. Bump it on every change to the chart.
version: 0.1.1
# Version of Open Archiver the chart deploys by default (the image tag).
appVersion: "v0.6.0"
kubeVersion: ">=1.27.0-0"
home: https://openarchiver.com
icon: https://raw.githubusercontent.com/LogicLabs-OU/OpenArchiver/main/docs/public/logo-sq.svg
sources:
  - https://github.com/egezamb/openarchiver-helm
  - https://github.com/LogicLabs-OU/OpenArchiver
keywords:
  - email
  - archiving
  - compliance
  - search
maintainers:
  - name: egezamb
    url: https://github.com/egezamb
annotations:
  # Read by Artifact Hub (https://artifacthub.io/docs/topics/annotations/helm/).
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/egezamb/openarchiver-helm
    - name: Open Archiver
      url: https://github.com/LogicLabs-OU/OpenArchiver
    - name: Chart request (#242)
      url: https://github.com/LogicLabs-OU/OpenArchiver/issues/242
  # Keep in step with the tags in values.yaml; CI checks that they match.
  artifacthub.io/images: |
    - name: open-archiver
      image: logiclabshq/open-archiver:v0.6.0
    - name: postgresql
      image: postgres:17.11-alpine
    - name: valkey
      image: valkey/valkey:8.1.10-alpine
    - name: meilisearch
      image: getmeili/meilisearch:v1.38.2
    - name: tika
      image: apache/tika:3.3.1.0-full
