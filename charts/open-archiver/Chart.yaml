apiVersion: v2
name: open-archiver
description: Self-hosted email archiving with full-text search. Runs Open Archiver with optional bundled PostgreSQL, Valkey, Meilisearch and Apache Tika.
type: application
# Version of the chart itself. Bump it on every change to the chart.
version: 0.1.1
# Version of Open Archiver the chart deploys by default (the image tag).
appVersion: "v0.6.0"
kubeVersion: ">=1.27.0-0"
home: https://openarchiver.com
icon: https://raw.githubusercontent.com/LogicLabs-OU/OpenArchiver/main/docs/public/logo-sq.svg
sources:
  - https://github.com/egezamb/openarchiver-helm
  - https://github.com/LogicLabs-OU/OpenArchiver
keywords:
  - email
  - archiving
  - compliance
  - search
maintainers:
  - name: egezamb
    url: https://github.com/egezamb
