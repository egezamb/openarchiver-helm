apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-archiver.fullname" . }}
  labels:
    {{- include "open-archiver.componentLabels" (dict "root" . "component" "app") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "open-archiver.selectorLabels" (dict "root" . "component" "app") | nindent 4 }}
