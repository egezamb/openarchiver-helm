{{- if .Values.ingress.enabled }}
{{- /*
The app checks the Origin header of form posts against APP_URL, so a host that does not match
appUrl gets 403 on every login. Catch that at install time instead.
*/}}
{{- $appHost := (urlParse .Values.appUrl).host | splitList ":" | first }}
{{- $hosts := list }}
{{- range .Values.ingress.hosts }}{{ $hosts = append $hosts .host }}{{ end }}
{{- if not (has $appHost $hosts) }}
{{- fail (printf "appUrl host %q is not one of ingress.hosts %v. Set appUrl to the address users open." $appHost $hosts) }}
{{- end }}
{{- /* The login token is a cookie without the Secure flag, so plain HTTP exposes it. */}}
{{- if and (not .Values.ingress.allowInsecureHttp) (or (ne (urlParse .Values.appUrl).scheme "https") (not .Values.ingress.tls)) }}
{{- fail "ingress needs appUrl with https:// and ingress.tls. Set ingress.allowInsecureHttp: true only for tests." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "open-archiver.fullname" . }}
  labels:
    {{- include "open-archiver.componentLabels" (dict "root" . "component" "app") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "open-archiver.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
