apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-archiver.fullname" . }}
  labels:
    {{- include "open-archiver.componentLabels" (dict "root" . "component" "app") | nindent 4 }}
spec:
  # One replica only: every pod runs the scheduler and the workers, and the local archive volume
  # is ReadWriteOnce. Recreate stops the old pod before the new one starts, so two never share it.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "open-archiver.selectorLabels" (dict "root" . "component" "app") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- /* Only values the user sets; generated ones would differ between renders. */}}
        checksum/secrets: {{ pick .Values.secrets "jwtSecret" "encryptionKey" "storageEncryptionKey" "existingSecret" | toJson | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "open-archiver.componentLabels" (dict "root" . "component" "app") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "open-archiver.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: open-archiver
          image: {{ include "open-archiver.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "open-archiver.fullname" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-archiver.secretName" . }}
                  key: jwt-secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-archiver.secretName" . }}
                  key: encryption-key
            {{- if or .Values.secrets.existingSecret .Values.secrets.storageEncryptionKey }}
            - name: STORAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-archiver.secretName" . }}
                  key: storage-encryption-key
                  # Optional in an existing Secret: without it, files are stored unencrypted.
                  optional: true
            {{- end }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-archiver.database.secretName" . }}
                  key: {{ include "open-archiver.database.secretKey" . }}
            {{- if include "open-archiver.redis.hasPassword" . }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-archiver.redis.secretName" . }}
                  key: {{ include "open-archiver.redis.secretKey" . }}
            {{- end }}
            {{- if include "open-archiver.meilisearch.hasKey" . }}
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-archiver.meilisearch.secretName" . }}
                  key: {{ include "open-archiver.meilisearch.secretKey" . }}
            {{- end }}
            {{- if eq .Values.storage.type "s3" }}
            - name: STORAGE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-archiver.s3.secretName" . }}
                  key: s3-access-key-id
            - name: STORAGE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-archiver.s3.secretName" . }}
                  key: s3-secret-access-key
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if eq .Values.storage.type "local" }}
            - name: data
              mountPath: {{ .Values.storage.localRootPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if eq .Values.storage.type "local" }}
        - name: data
          {{- with include "open-archiver.storage.claimName" . }}
          persistentVolumeClaim:
            claimName: {{ . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
