{{- /*
Every Secret the chart creates lives in this file, so each generated value is rendered exactly once.
Secrets holding generated values are kept on `helm uninstall`: the database and the archive cannot
be read without them, and a reinstall under the same release name picks them up again.
*/}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "open-archiver.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-archiver.componentLabels" (dict "root" . "component" "app") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  jwt-secret: {{ include "open-archiver.secretValue" (dict "root" . "secret" $name "key" "jwt-secret" "value" .Values.secrets.jwtSecret "length" 64) | b64enc | quote }}
  encryption-key: {{ include "open-archiver.secretValue" (dict "root" . "secret" $name "key" "encryption-key" "value" .Values.secrets.encryptionKey "hex" true) | b64enc | quote }}
  {{- /*
  The storage key is never generated, but once set it is kept like the generated values: an upgrade
  without it in values would otherwise drop it, and the app then writes new files unencrypted and
  serves the old ones as unreadable bytes, without any error.
  */}}
  {{- $stored := "" }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- if and $existing (index $existing.data "storage-encryption-key") }}
  {{- $stored = index $existing.data "storage-encryption-key" | b64dec }}
  {{- end }}
  {{- $storageKey := .Values.secrets.storageEncryptionKey | default $stored }}
  {{- if and $stored (ne $stored $storageKey) }}
  {{- fail "secrets.storageEncryptionKey differs from the key the archive was written with. Changing it makes the archived files unreadable." }}
  {{- end }}
  {{- with $storageKey }}
  {{- if not (regexMatch "^[a-fA-F0-9]{64}$" .) }}
  {{- fail "secrets.storageEncryptionKey must be 64 hex characters (openssl rand -hex 32)" }}
  {{- end }}
  storage-encryption-key: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if .Values.postgresql.enabled }}
{{- with .Values.postgresql.auth }}
{{- if or (not .username) (eq .username "postgres") }}
{{- fail "postgresql.auth.username must be set and must not be postgres: the app needs its own non-superuser role" }}
{{- end }}
{{- if eq .existingSecretPasswordKey .existingSecretSuperuserPasswordKey }}
{{- fail "postgresql.auth: the app and superuser passwords need different Secret keys" }}
{{- end }}
{{- if and .password (eq .password .postgresPassword) }}
{{- fail "postgresql.auth.password and postgresql.auth.postgresPassword must differ" }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $name := include "open-archiver.database.secretName" . }}
{{- /*
PostgreSQL stores both passwords when it creates the database and never reads them again, so a new
value here would only break the app's login. Refuse it; change the password in the database first.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- range $value, $key := dict .Values.postgresql.auth.password .Values.postgresql.auth.existingSecretPasswordKey .Values.postgresql.auth.postgresPassword .Values.postgresql.auth.existingSecretSuperuserPasswordKey }}
{{- if and $value $existing (index $existing.data $key) (ne (index $existing.data $key | b64dec) $value) }}
{{- fail (printf "the PostgreSQL password in key %s differs from the one the database was created with. Run ALTER ROLE ... PASSWORD in the database first, then update the Secret by hand." $key) }}
{{- end }}
{{- end }}
{{- $key := .Values.postgresql.auth.existingSecretPasswordKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-archiver.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ include "open-archiver.secretValue" (dict "root" . "secret" $name "key" $key "value" .Values.postgresql.auth.password) | b64enc | quote }}
  {{- $superKey := .Values.postgresql.auth.existingSecretSuperuserPasswordKey }}
  {{ $superKey }}: {{ include "open-archiver.secretValue" (dict "root" . "secret" $name "key" $superKey "value" .Values.postgresql.auth.postgresPassword) | b64enc | quote }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-archiver.database.secretName" . }}
  labels:
    {{- include "open-archiver.componentLabels" (dict "root" . "component" "app") | nindent 4 }}
type: Opaque
data:
  {{ .Values.externalDatabase.existingSecretPasswordKey }}: {{ required "externalDatabase.password or externalDatabase.existingSecret is required when postgresql.enabled is false" .Values.externalDatabase.password | b64enc | quote }}
{{- end }}
{{- if and .Values.valkey.enabled (not .Values.valkey.auth.existingSecret) }}
{{- $name := include "open-archiver.redis.secretName" . }}
{{- $key := .Values.valkey.auth.existingSecretPasswordKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-archiver.componentLabels" (dict "root" . "component" "valkey") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ include "open-archiver.secretValue" (dict "root" . "secret" $name "key" $key "value" .Values.valkey.auth.password) | b64enc | quote }}
{{- end }}
{{- if and (not .Values.valkey.enabled) (not .Values.externalRedis.existingSecret) .Values.externalRedis.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-archiver.redis.secretName" . }}
  labels:
    {{- include "open-archiver.componentLabels" (dict "root" . "component" "app") | nindent 4 }}
type: Opaque
data:
  {{ .Values.externalRedis.existingSecretPasswordKey }}: {{ .Values.externalRedis.password | b64enc | quote }}
{{- end }}
{{- if and .Values.meilisearch.enabled .Values.meilisearch.masterKey (lt (len (toString .Values.meilisearch.masterKey)) 16) }}
{{- fail "meilisearch.masterKey must be at least 16 bytes long" }}
{{- end }}
{{- if and .Values.meilisearch.enabled (not .Values.meilisearch.existingSecret) }}
{{- $name := include "open-archiver.meilisearch.secretName" . }}
{{- $key := .Values.meilisearch.existingSecretKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-archiver.componentLabels" (dict "root" . "component" "meilisearch") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- /* Meilisearch refuses master keys shorter than 16 bytes in production mode. */}}
  {{ $key }}: {{ include "open-archiver.secretValue" (dict "root" . "secret" $name "key" $key "value" .Values.meilisearch.masterKey "length" 32) | b64enc | quote }}
{{- end }}
{{- if and (not .Values.meilisearch.enabled) (not .Values.externalMeilisearch.existingSecret) .Values.externalMeilisearch.masterKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-archiver.meilisearch.secretName" . }}
  labels:
    {{- include "open-archiver.componentLabels" (dict "root" . "component" "app") | nindent 4 }}
type: Opaque
data:
  {{ .Values.externalMeilisearch.existingSecretKey }}: {{ .Values.externalMeilisearch.masterKey | b64enc | quote }}
{{- end }}
{{- if and (eq .Values.storage.type "s3") (not .Values.storage.s3.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-archiver.s3.secretName" . }}
  labels:
    {{- include "open-archiver.componentLabels" (dict "root" . "component" "app") | nindent 4 }}
type: Opaque
data:
  s3-access-key-id: {{ required "storage.s3.accessKeyId or storage.s3.existingSecret is required when storage.type is s3" .Values.storage.s3.accessKeyId | b64enc | quote }}
  s3-secret-access-key: {{ required "storage.s3.secretAccessKey or storage.s3.existingSecret is required when storage.type is s3" .Values.storage.s3.secretAccessKey | b64enc | quote }}
{{- end }}
