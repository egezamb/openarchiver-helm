{{- if .Values.networkPolicy.enabled }}
{{- /*
Lets traffic reach the web UI port only. The API also listens on 4000 inside the pod, and the
frontend proxy is the only thing meant to talk to it. Probes come from the kubelet and are not
affected. Egress stays open: the app needs npm at start, the mail servers it archives and S3.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "open-archiver.fullname" . }}
  labels:
    {{- include "open-archiver.componentLabels" (dict "root" . "component" "app") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "open-archiver.selectorLabels" (dict "root" . "component" "app") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
