name: Lint and test

on:
  pull_request:
    paths:
      - charts/**
      - tests/**
      - ct.yaml
      - scripts/**
      - .github/workflows/lint-test.yaml
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      # On a push to main there is no diff against the target branch, so ct would lint nothing.
      - name: ct lint
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            ct lint --config ct.yaml --all --check-version-increment=false
          else
            ct lint --config ct.yaml
          fi

      - name: Artifact Hub image list matches the chart
        run: scripts/check-images.sh

      # Template unit tests (tests/unit, outside the chart so they are not packaged). The plugin's
      # install hook downloads the release archive for this version and checks its checksum.
      - name: helm unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1 --verify=false
          helm unittest charts/open-archiver -f '../../tests/unit/*_test.yaml'

      - name: Validate rendered manifests
        run: |
          curl -sSLo kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  kubeconform.tgz" | sha256sum -c -
          tar xzf kubeconform.tgz kubeconform
          # The oldest Kubernetes the chart claims (kubeVersion in Chart.yaml is >=1.27) up to the
          # newest one kubeconform has schemas for (yannh/kubernetes-json-schema stops at 1.34), so
          # a removed or new API version shows up before users hit it.
          for k8s in 1.27.0 1.30.0 1.34.0; do
            for values in "" charts/open-archiver/ci/*-values.yaml; do
              echo "::group::kubeconform $k8s ${values:-defaults}"
              helm template ci charts/open-archiver --kube-version "$k8s" ${values:+-f "$values"} \
                | ./kubeconform -strict -summary -kubernetes-version "$k8s"
              echo "::endgroup::"
            done
          done

  install:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      # Installs the chart once per ci/*-values.yaml, runs `helm test`, then uninstalls.
      - name: ct install
        run: ct install --config ct.yaml --all
