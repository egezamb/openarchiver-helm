name: Release

# Publishes the chart to GitHub Container Registry as an OCI artifact when its version in
# Chart.yaml is new. Re-running on an already published version does nothing.
on:
  push:
    branches:
      - main
    paths:
      - charts/open-archiver/Chart.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REPOSITORY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the GitHub release and its tag
      packages: write
      id-token: write # keyless cosign signing through GitHub's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Read the chart version
        id: chart
        run: |
          echo "version=$(sed -nE 's/^version: *//p' charts/open-archiver/Chart.yaml)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | helm registry login "$REGISTRY" --username "$ACTOR" --password-stdin

      - name: Skip a version that is already published
        id: published
        env:
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          if helm show chart "oci://$REPOSITORY/open-archiver" --version "$VERSION" >/dev/null 2>&1; then
            echo "open-archiver $VERSION is already published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          helm package charts/open-archiver --destination dist
          helm push dist/open-archiver-*.tgz "oci://$REPOSITORY" 2>&1 | tee push.log
          echo "digest=$(sed -nE 's/^Digest: *//p' push.log)" >> "$GITHUB_OUTPUT"

      # Keyless: the signature names this workflow and commit, recorded in Sigstore's public log.
      - name: Sign the pushed chart
        if: steps.published.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          test -n "$DIGEST" || { echo "helm push printed no digest"; exit 1; }
          echo "$TOKEN" | cosign login "$REGISTRY" --username "$ACTOR" --password-stdin
          cosign sign --yes "$REPOSITORY/open-archiver@$DIGEST"

      # Artifact Hub reads the repository's metadata from this tag. Pushed on every release, so a
      # change to artifacthub-repo.yml reaches it with the next version.
      - name: Push the Artifact Hub metadata
        if: steps.published.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | oras login "$REGISTRY" --username "$ACTOR" --password-stdin
          oras push "$REPOSITORY/open-archiver:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Create the GitHub release
        if: steps.published.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.chart.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh release create "open-archiver-$VERSION" dist/open-archiver-*.tgz \
            --target "$GITHUB_SHA" --title "open-archiver $VERSION" \
            --notes "OCI: \`oci://$REPOSITORY/open-archiver\` version \`$VERSION\`, digest \`$DIGEST\`. Signed with keyless cosign; see the README to verify."
