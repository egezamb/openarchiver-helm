# The guards in templates/secrets.yaml that protect existing data. The cluster is mocked
# (kubernetesProvider), so `lookup` sees the Secret an earlier install left behind.
suite: secrets
templates:
  - templates/secrets.yaml
release:
  name: oa
  namespace: archive
# A Secret from an earlier install, holding the storage key "a" * 64.
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: oa-open-archiver
        namespace: archive
      data:
        storage-encryption-key: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYQ==
tests:
  - it: keeps the storage key on an upgrade whose values leave it out
    documentSelector:
      path: metadata.name
      value: oa-open-archiver
    asserts:
      - equal:
          path: data["storage-encryption-key"]
          value: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYQ==

  - it: accepts the same storage key again
    set:
      secrets.storageEncryptionKey: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    documentSelector:
      path: metadata.name
      value: oa-open-archiver
    asserts:
      - equal:
          path: data["storage-encryption-key"]
          value: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYQ==

  - it: refuses a storage key that differs from the one the archive was written with
    set:
      secrets.storageEncryptionKey: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    asserts:
      - failedTemplate:
          errorPattern: differs from the key the archive was written with

  - it: keeps the generated Secrets on helm uninstall
    documentSelector:
      path: metadata.name
      value: oa-open-archiver
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
---
suite: secrets on a fresh install
templates:
  - templates/secrets.yaml
release:
  name: oa
  namespace: archive
tests:
  - it: stores no storage key unless one is given
    documentSelector:
      path: metadata.name
      value: oa-open-archiver
    asserts:
      - notExists:
          path: data["storage-encryption-key"]

  - it: creates no app Secret when secrets.existingSecret is set
    set:
      secrets.existingSecret: my-secret
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: oa-open-archiver
        not: true

  - it: refuses postgres as the app's database user
    set:
      postgresql.auth.username: postgres
    asserts:
      - failedTemplate:
          errorPattern: must not be postgres

  - it: refuses the same password for the app and the superuser
    set:
      postgresql.auth.password: same-password
      postgresql.auth.postgresPassword: same-password
    asserts:
      - failedTemplate:
          errorPattern: must differ

  - it: needs S3 credentials when storage.type is s3
    set:
      storage.type: s3
    asserts:
      - failedTemplate:
          errorPattern: storage.s3.accessKeyId or storage.s3.existingSecret is required
